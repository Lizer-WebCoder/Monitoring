<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DR CARE — Loading…</title><link rel="manifest" href="./manifest.json"></head>
<body style="font-family:system-ui;background:#0b3c26;color:#e8f0ed;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0">
<div style="text-align:center"><div style="font-weight:800;font-size:18px;margin-bottom:8px">DR CARE</div><div id="st" style="opacity:.8">Loading app…</div></div>
<script>
(async function(){
  const st = document.getElementById('st');
  try {
    const n = 2;
    let b64 = '';
    for (let i = 0; i < n; i++) {
      st.textContent = 'Loading ' + (i+1) + '/' + n + '…';
      const r = await fetch('./app.part' + i + '.b64?v=2');
      if (!r.ok) throw new Error('Missing part ' + i);
      b64 += (await r.text()).trim();
    }
    st.textContent = 'Decoding…';
    const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const ds = new DecompressionStream('gzip');
    const stream = new Blob([bin]).stream().pipeThrough(ds);
    const html = await new Response(stream).text();
    document.open(); document.write(html); document.close();
  } catch (e) {
    st.innerHTML = '<b>Load failed</b><br>' + (e.message||e) + '<br><small>Hard refresh (Ctrl+Shift+R)</small>';
  }
})();
</script></body></html>
