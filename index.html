<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DR CARE</title></head><body>
<p id="m" style="font-family:system-ui;padding:24px">Loading DR CARE…</p>
<script>
(async function(){
  try{
    const n = 10;
    let b64 = '';
    for (let i = 0; i < n; i++) {
      const r = await fetch('./app.gz.part' + i + '.b64');
      if (!r.ok) throw new Error('Missing app.gz.part' + i + '.b64');
      b64 += await r.text();
    }
    b64 = b64.replace(/\s+/g, '');
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    if (typeof DecompressionStream === 'undefined') throw new Error('Browser cannot decompress. Use Vercel Instant Rollback.');
    const ds = new DecompressionStream('gzip');
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    const html = await new Response(stream).text();
    document.open(); document.write(html); document.close();
  } catch (e) {
    document.getElementById('m').innerHTML = 'Could not load app: ' + e.message +
      '<br><br><b>Quick fix:</b> Vercel → Instant Rollback to last good deployment.';
  }
})();
</script>
</body></html>
