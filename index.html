<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DR CARE — restoring…</title>
<script>
(async function () {
  var urls = [
    'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/Monitoring@d9c956bcf052540e8c3b260ad7947c9c8a611c87/index.html',
    'https://raw.githack.com/Lizer-WebCoder/Monitoring/d9c956bcf052540e8c3b260ad7947c9c8a611c87/index.html'
  ];
  var lastErr = null;
  for (var i = 0; i < urls.length; i++) {
    try {
      var res = await fetch(urls[i], { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var html = await res.text();
      if (html.indexOf('<!DOCTYPE') < 0 && html.indexOf('<html') < 0) throw new Error('Not HTML');
      html = html.split('By : \u1D41\u1D52\u1D5A\uA731 \u1D00\u1D1B \u1D1B\u1D04\u1D07 \u1D41\u1D00\u1D04\u1D0B \u00B7 \u00A9 2026 All rights reserved').join('By : Lizer \u2665 \u00B7 \u00A9 2026 All rights reserved');
      html = html.split('By : \uD835\uDE0B\uD835\uDE38\uD835\uDE42\uA731 \uD835\uDE2A\uD835\uDE3D \uD835\uDE3D\uD835\uDE31\uD835\uDE2E \uD835\uDE0B\uD835\uDE2A\uD835\uDE2C\uD835\uDE34').join('By : Lizer \u2665 \u00B7 \u00A9 2026 All rights reserved');
      // Plain ASCII fallback patterns
      html = html.replace(/By : [^·\n]{3,40} · © 2026 All rights reserved/g, 'By : Lizer \u2665 · © 2026 All rights reserved');
      html = html.split('Generated by DR CARE · Boyz at the Back').join('Generated by DR CARE · Lizer');
      document.open();
      document.write(html);
      document.close();
      return;
    } catch (e) {
      lastErr = e;
    }
  }
  document.body.innerHTML = '<p style="font-family:system-ui;padding:24px">Could not restore DR CARE. Open GitHub Actions / contact admin.<br><small>' + (lastErr && lastErr.message ? lastErr.message : '') + '</small></p>';
})();
</script>
</head>
<body style="font-family:system-ui;padding:24px;color:#0f172a">Loading DR CARE…</body>
</html>
