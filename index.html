<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DR CARE</title></head><body>
<p id="m" style="font-family:system-ui;padding:24px">Loading DR CARE…</p>
<script>
(async function(){
  try{
    const n = 8;
    const parts = [];
    for (let i = 0; i < n; i++) {
      const r = await fetch('./app.part' + i + '.b64');
      if (!r.ok) throw new Error('Missing app.part' + i + '.b64 (' + r.status + ')');
      parts.push(await r.text());
    }
    const b64 = parts.join('').replace(/\s+/g, '');
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const html = new TextDecoder('utf-8').decode(bytes);
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.getElementById('m').innerHTML = 'Could not load app: ' + e.message +
      '<br><br>Fix: Vercel → Instant Rollback to the last good deployment.';
  }
})();
</script>
</body></html>
