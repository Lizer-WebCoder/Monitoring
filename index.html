<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Patients Management</title>
<style>
  /* Basic styles for modal and table */
  #modalBackdrop { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
  #modalBackdrop.open { display: flex; }
  #patientModal { background: #fff; padding: 20px; border-radius: 8px; max-width: 400px; width: 100%; }
  .patient-row { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #ccc; }
  #groupsContainer { max-height: 300px; overflow-y: auto; margin-top: 20px; }
</style>
</head>
<body>

<h1>Patients Management</h1>
<button onclick="showAddPatientModal()">Add Patient</button>

<div id="groupsContainer"></div>

<!-- Modal for add/edit -->
<div id="modalBackdrop">
  <div id="patientModal">
    <h2 id="modalTitle">Add/Edit Patient</h2>
    <label>Name: <input type="text" id="f_name" /></label><br />
    <label>PHID: <input type="text" id="f_phid" /></label><br />
    <!-- Add more fields as needed -->
    <button id="saveBtn">Save</button>
    <button onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
  // Utility functions for modal
  function showModal() {
    document.getElementById('modalBackdrop').classList.add('open');
  }
  function closeModal() {
    document.getElementById('modalBackdrop').classList.remove('open');
  }

  // Show modal for adding a new patient
  function showAddPatientModal() {
    document.getElementById('modalTitle').innerText = 'Add Patient';
    document.getElementById('f_name').value = '';
    document.getElementById('f_phid').value = '';
    // Remove previous save handler
    document.getElementById('saveBtn').onclick = async () => {
      await addPatient();
      closeModal();
    };
    showModal();
  }

  // Load patients from IndexedDB
  async function loadPatients() {
    const data = await fetchShared("patients");
    let patients = [];
    if (data) {
      patients = JSON.parse(data);
    }
    renderPatients(patients);
  }

  // Save patients to IndexedDB
  async function savePatientsData(patients) {
    await pushShared("patients", JSON.stringify(patients));
  }

  // Render patients in UI
  function renderPatients(patients) {
    const container = document.getElementById('groupsContainer');
    container.innerHTML = '';
    patients.forEach(patient => {
      const row = document.createElement('div');
      row.className = 'patient-row';
      row.innerHTML = `
        <div>${patient.name}</div>
        <div>${patient.phID}</div>
        <button onclick="editPatient('${patient.id}')">Edit</button>
        <button onclick="deletePatient('${patient.id}')">Delete</button>
      `;
      container.appendChild(row);
    });
  }

  // Add a new patient
  async function addPatient() {
    const name = document.getElementById('f_name').value.trim();
    const phID = document.getElementById('f_phid').value.trim();
    if (!name || !phID) {
      alert('Please fill all fields.');
      return;
    }
    const newPatient = {
      id: Date.now().toString(),
      name,
      phID
    };
    const data = await fetchShared("patients");
    let patients = data ? JSON.parse(data) : [];
    patients.push(newPatient);
    await savePatientsData(patients);
    renderPatients(patients);
  }

  // Edit existing patient
  async function editPatient(patientId) {
    const data = await fetchShared("patients");
    const patients = data ? JSON.parse(data) : [];
    const patient = patients.find(p => p.id === patientId);
    if (patient) {
      // Fill modal fields
      document.getElementById('f_name').value = patient.name;
      document.getElementById('f_phid').value = patient.phID;
      document.getElementById('modalTitle').innerText = 'Edit Patient';

      // Set save handler
      document.getElementById('saveBtn').onclick = async () => {
        const name = document.getElementById('f_name').value.trim();
        const phID = document.getElementById('f_phid').value.trim();
        if (!name || !phID) {
          alert('Please fill all fields.');
          return;
        }
        patient.name = name;
        patient.phID = phID;
        await savePatientsData(patients);
        renderPatients(patients);
        closeModal();
      };
      showModal();
    }
  }

  // Delete patient
  async function deletePatient(patientId) {
    const data = await fetchShared("patients");
    let patients = data ? JSON.parse(data) : [];
    patients = patients.filter(p => p.id !== patientId);
    await savePatientsData(patients);
    renderPatients(patients);
  }

  // Initialize on page load
  window.onload = () => {
    loadPatients();
  };
</script>

</body>
</html>
