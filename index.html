<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/dexie@3/dist/dexie.min.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Field Roster — Divine Rays Mobile Operations Tracker</title>
  <style>
    :root{
      --ink:#12312b;
      --paper:#f6f4ef;
      --card:#ffffff;
      --line:#dcd6c8;
      --teal:#14524a;
      --teal-deep:#0b3630;
      --amber:#c8862b;
      --amber-bg:#fbeed9;
      --blue:#2f5f8a;
      --blue-bg:#e4edf5;
      --green:#3d7a4f;
      --green-bg:#e2efe3;
      --red:#a8402f;
      --red-bg:#f6e3df;
      --purple:#6b3fa0;
      --purple-bg:#efe3fb;
      --muted:#6c7570;
      --shadow: 0 1px 2px rgba(18,49,43,0.06), 0 6px 20px rgba(18,49,43,0.05);
      --radius: 10px;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
      background:var(--paper);
      color:var(--ink);
      font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing:antialiased;
      padding-bottom:60px;
    }
    .mono{ font-family:'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace; }

    /* ... (rest of your CSS remains unchanged) ... */
  </style>
</head>
<body>

<header>
  <div class="header-row">
    <div>
      <div class="brand-eyebrow">Divine Rays Mobile Operations</div>
      <h1 class="brand-title">Field Roster <span class="tag">Patient Tracker</span></h1>
      <input class="org-input" id="orgName" placeholder="Organization / mission name (click to edit)">
      <div class="sync-pill" id="syncPill">Connecting…</div>
    </div>
    <div class="stat-strip" id="statStrip"></div>
  </div>
</header>

<div class="toolbar">
  <button class="btn btn-primary" id="addPatientBtn">+ Add Patient</button>
  <button class="btn" id="addTeamBtn">+ Add Team / Site</button>
  <input type="text" id="search" placeholder="Search name or PhilHealth ID…">
  <select id="filterStatus">
    <option value="">All statuses</option>
    <option value="registered">Registered</option>
    <option value="registered_other">Registered to other DR facility</option>
  </select>
  <select id="filterBenefit">
    <option value="">All benefit states</option>
    <option value="rice-yes">Rice availed</option>
    <option value="rice-no">Rice not yet availed</option>
    <option value="lab-yes">Lab availed</option>
    <option value="lab-no">Lab not yet availed</option>
  </select>
  <div class="spacer"></div>
  <button class="btn" id="syncNowBtn">🔄 Sync now</button>
  <button class="btn" id="exportBtn">⬇ Export CSV</button>
  <button class="btn" id="importBtn">⬆ Import CSV</button>
  <input type="file" id="importFile" accept=".csv" />
  <button class="btn" id="printBtn">🖨 Print</button>
</div>

<div id="groupsContainer"></div>

<div class="legend" id="legend"></div>

<!-- Patient Modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalTitle">Add Patient</h3>
    <div class="modal-sub">
      Fields marked with the team dropdown determine which group this row appears under.
    </div>
    <div class="form-grid">
      <!-- ... (rest of your modal code) ... -->
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Save patient</button>
    </div>
  </div>
</div>

<script>
/* ---------------- Dexie setup ---------------- */
const db = new Dexie("FieldRosterDB");
db.version(1).stores({
  patients: 'id'
});

/* ---------------- Storage functions ---------------- */
async function fetchShared(key) {
  if (key !== "patients") return null;
  try {
    const allPatients = await db.patients.toArray();
    return JSON.stringify(allPatients);
  } catch (e) {
    console.error("Dexie fetch error:", e);
    return null;
  }
}

async function pushShared(key, value) {
  if (key !== "patients") return;
  try {
    await db.patients.clear();
    const patients = JSON.parse(value);
    await db.patients.bulkAdd(patients);
  } catch (e) {
    console.error("Dexie push error:", e);
  }
}

/* Your existing script continues here... */

// Example initialization: load patients from local storage on page load
window.onload = async () => {
  const data = await fetchShared("patients");
  if (data) {
    // Parse and initialize your app with data if needed
    // For example, you may want to load patients into your UI
    console.log("Loaded patients:", JSON.parse(data));
    // You can implement your data loading logic here
  }
  // Set organization name if stored
  const orgName = localStorage.getItem("orgName");
  if (orgName) document.getElementById("orgName").value = orgName;
  setSyncStatus("Connected", ""); // or update based on actual sync status
};

/* Save organization name on change */
document.getElementById("orgName").addEventListener("change", () => {
  localStorage.setItem("orgName", document.getElementById("orgName").value);
});

/* Example: Save patients data when needed */
async function savePatientsData(patientsArray) {
  await pushShared("patients", JSON.stringify(patientsArray));
}

/* You should replace your existing save/load logic with calls to these functions as needed. */

</script>
</body>
</html>
