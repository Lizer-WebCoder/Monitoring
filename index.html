<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Patient Management</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f4f6f8;
    margin: 0;
    padding: 20px;
  }
  h1 {
    text-align: center;
    color: #333;
  }
  .form-container {
    max-width: 600px;
    margin: 0 auto 20px auto;
    background: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .form-group {
    display: flex;
    flex-direction: column;
    margin-bottom: 12px;
  }
  label {
    margin-bottom: 4px;
    font-weight: bold;
  }
  input[type="text"] {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  button {
    background-color: #4CAF50;
    color: white;
    padding: 12px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
    transition: background 0.3s;
  }
  button:hover {
    background-color: #45a049;
  }
  #patientsList {
    max-width: 600px;
    margin: 0 auto;
  }
  .patient-card {
    background: #fff;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .patient-info {
    max-width: 70%;
  }
  .patient-info p {
    margin: 4px 0;
  }
  .actions button {
    background-color: #e74c3c;
    margin-left: 8px;
  }
  .actions button:hover {
    background-color: #c0392b;
  }
</style>
</head>
<body>

<h1>Patient Management System</h1>

<div class="form-container">
  <h2>Add New Patient</h2>
  <div class="form-group">
    <label for="f_name">Name:</label>
    <input type="text" id="f_name" placeholder="Enter patient's name" />
  </div>
  <div class="form-group">
    <label for="f_phid">PHID:</label>
    <input type="text" id="f_phid" placeholder="Enter patient's PHID" />
  </div>
  <button id="addPatientBtn">Add Patient</button>
</div>

<div id="patientsList"></div>

<script>
  const patients = [];

  const addBtn = document.getElementById('addPatientBtn');

  addBtn.addEventListener('click', () => {
    const name = document.getElementById('f_name').value.trim();
    const phid = document.getElementById('f_phid').value.trim();

    if (name && phid) {
      patients.push({ name, phid });
      renderPatients();
      document.getElementById('f_name').value = '';
      document.getElementById('f_phid').value = '';
    } else {
      alert('Please enter both name and PHID.');
    }
  });

  function renderPatients() {
    const listContainer = document.getElementById('patientsList');
    listContainer.innerHTML = '';

    patients.forEach((patient, index) => {
      const card = document.createElement('div');
      card.className = 'patient-card';

      const infoDiv = document.createElement('div');
      infoDiv.className = 'patient-info';
      infoDiv.innerHTML = `
        <p><strong>Name:</strong> ${patient.name}</p>
        <p><strong>PHID:</strong> ${patient.phid}</p>
      `;

      const actionsDiv = document.createElement('div');
      actionsDiv.className = 'actions';

      const deleteBtn = document.createElement('button');
      deleteBtn.textContent = 'Delete';
      deleteBtn.onclick = () => {
        patients.splice(index, 1);
        renderPatients();
      };

      // Optional: Add an Edit button in the future

      actionsDiv.appendChild(deleteBtn);

      card.appendChild(infoDiv);
      card.appendChild(actionsDiv);

      listContainer.appendChild(card);
    });
  }
</script>

</body>
</html>
