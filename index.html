<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Roster — Divine Rays Mobile Operations Tracker</title>
<style>
  :root{
    --ink:#12312b;
    --paper:#f6f4ef;
    --card:#ffffff;
    --line:#dcd6c8;
    --teal:#14524a;
    --teal-deep:#0b3630;
    --amber:#c8862b;
    --amber-bg:#fbeed9;
    --blue:#2f5f8a;
    --blue-bg:#e4edf5;
    --green:#3d7a4f;
    --green-bg:#e2efe3;
    --red:#a8402f;
    --red-bg:#f6e3df;
    --purple:#6b3fa0;
    --purple-bg:#efe3fb;
    --muted:#6c7570;
    --shadow: 0 1px 2px rgba(18,49,43,0.06), 0 6px 20px rgba(18,49,43,0.05);
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  .mono{ font-family:'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace; }

  /* ---------- Header ---------- */
  header{
    background:linear-gradient(180deg, var(--teal-deep), var(--teal));
    color:#f2ede0;
    padding:22px 26px 20px;
    position:sticky; top:0; z-index:30;
    box-shadow:0 4px 14px rgba(11,54,48,0.25);
  }
  .header-row{
    display:flex; align-items:flex-start; justify-content:space-between; gap:18px; flex-wrap:wrap;
    max-width:1400px; margin:0 auto;
  }
  .brand-eyebrow{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#a9c9bf; margin-bottom:4px; font-weight:600;
  }
  .brand-title{
    font-size:24px; font-weight:800; letter-spacing:-0.01em; margin:0;
    display:flex; align-items:center; gap:10px;
  }
  .brand-title .tag{
    font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    background:rgba(255,255,255,0.14); padding:3px 8px; border-radius:20px; color:#f2ede0;
  }
  .org-input{
    background:transparent; border:none; border-bottom:1px dashed rgba(255,255,255,0.35);
    color:#f2ede0; font-size:13px; padding:2px 0; width:260px; margin-top:6px; font-family:inherit;
  }
  .org-input::placeholder{ color:rgba(242,237,224,0.55); }
  .org-input:focus{ outline:none; border-bottom-color:#f2ede0; }
  .sync-pill{
    display:inline-flex; align-items:center; gap:6px; margin-top:8px;
    font-size:11px; font-weight:600; color:#c7dcd5;
  }
  .sync-pill::before{
    content:''; width:7px; height:7px; border-radius:50%; background:#7fd6a0; flex:none;
  }
  .sync-pill.err::before{ background:#e2897a; }
  .sync-pill.busy::before{ background:#e0c479; }

  .stat-strip{ display:flex; gap:10px; flex-wrap:wrap; }
  .stat{
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15);
    border-radius:10px; padding:8px 14px; min-width:92px; text-align:center;
  }
  .stat .num{ font-size:20px; font-weight:800; line-height:1; font-family:'IBM Plex Mono',monospace; }
  .stat .lbl{ font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:#c7dcd5; margin-top:3px; }

  /* ---------- Toolbar ---------- */
  .toolbar{
    max-width:1400px; margin:16px auto 10px; padding:0 26px;
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  }
  .btn{
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    padding:9px 14px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; transition:all .12s ease; box-shadow:var(--shadow);
  }
  .btn:hover{ border-color:var(--teal); color:var(--teal-deep); transform:translateY(-1px); }
  .btn-primary{ background:var(--teal); color:#fff; border-color:var(--teal); }
  .btn-primary:hover{ background:var(--teal-deep); color:#fff; }
  .btn-ghost{ box-shadow:none; }
  input[type="text"], input[type="date"], select{
    font-family:inherit; font-size:13px; padding:9px 10px; border-radius:8px;
    border:1px solid var(--line); background:var(--card); color:var(--ink);
  }
  #search{ min-width:220px; flex:1; }
  .spacer{ flex:1; }
  input[type="file"]{ display:none; }

  /* ---------- Groups ---------- */
  .team-group{
    max-width:1400px; margin:18px auto; padding:0 26px;
  }
  .team-head{
    display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none;
    padding:10px 4px; border-bottom:2px solid var(--ink);
  }
  .team-head .chev{ transition:transform .15s ease; font-size:12px; color:var(--muted); }
  .team-head.collapsed .chev{ transform:rotate(-90deg); }
  .team-head h2{ font-size:15px; margin:0; letter-spacing:.02em; }
  .team-head .count{
    font-size:11px; color:var(--muted); font-family:'IBM Plex Mono',monospace;
    background:var(--line); padding:2px 8px; border-radius:20px;
  }
  .team-head .team-tools{ margin-left:auto; display:flex; gap:8px; }
  .team-head .team-tools button{
    background:none; border:none; color:var(--muted); font-size:12px; cursor:pointer; text-decoration:underline;
  }

  /* ---------- Table ---------- */
  .table-wrap{ overflow-x:auto; border-radius:var(--radius); box-shadow:var(--shadow); background:var(--card); margin-top:8px; }
  table{ width:100%; border-collapse:collapse; min-width:1260px; }
  thead th{
    position:sticky; top:0; background:#eef0e8; color:var(--teal-deep);
    font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; font-weight:700;
    padding:10px 10px; text-align:center; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  thead th:first-child{ text-align:left; }
  tbody tr{ border-bottom:1px solid #ece8dc; }
  tbody tr:hover{ background:#fbfaf6; }
  tbody tr.dup-row{ background:var(--red-bg); }
  td{ padding:9px 10px; font-size:13px; vertical-align:middle; }
  td.name{ font-weight:600; min-width:190px; }
  td.name .sub{ display:block; font-size:11px; color:var(--muted); font-weight:400; }
  .idcell{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; }
  .datecell{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); white-space:nowrap; text-align:center; }

  input[type="checkbox"]{ width:17px; height:17px; accent-color:var(--teal); cursor:pointer; }

  .badge-select{
    border:none; border-radius:20px; padding:5px 10px 5px 9px; font-size:11.5px; font-weight:700;
    cursor:pointer; appearance:none; -webkit-appearance:none; text-align:left;
    background-position:right 7px center; background-repeat:no-repeat; background-size:9px;
    padding-right:22px;
  }
  .st-registered{ background:var(--amber-bg); color:var(--amber); }
  .st-registered-other{ background:var(--purple-bg); color:var(--purple); }
  .st-validated{ background:var(--blue-bg); color:var(--blue); }
  .st-submitted{ background:var(--green-bg); color:var(--green); }
  .st-hold{ background:var(--red-bg); color:var(--red); }

  .fac-select{ background:#eef0e8; color:var(--ink); }
  .fac-fixed{ font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:20px; background:var(--amber-bg); color:var(--amber); display:inline-block; }

  .cl-pending{ background:var(--amber-bg); color:var(--amber); }
  .cl-t1{ background:var(--blue-bg); color:var(--blue); }
  .cl-missed24{ background:var(--red-bg); color:var(--red); }

  .dup-tag{ font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; }
  .dup-new{ background:var(--green-bg); color:var(--green); }
  .dup-flag{ background:var(--red-bg); color:var(--red); }

  .row-actions{ display:flex; gap:6px; }
  .icon-btn{
    border:none; background:none; cursor:pointer; color:var(--muted); font-size:14px; padding:3px 5px; border-radius:6px;
  }
  .icon-btn:hover{ background:var(--line); color:var(--ink); }

  .empty-state{
    text-align:center; padding:50px 20px; color:var(--muted); font-size:13px;
  }

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(18,49,43,0.45); display:none;
    align-items:flex-start; justify-content:center; z-index:100; padding:40px 16px; overflow-y:auto;
  }
  .modal-backdrop.open{ display:flex; }
  .modal{
    background:var(--card); border-radius:14px; max-width:640px; width:100%;
    padding:26px 28px 22px; box-shadow:0 20px 60px rgba(11,54,48,0.3);
  }
  .modal h3{ margin:0 0 4px; font-size:17px; }
  .modal .modal-sub{ font-size:12px; color:var(--muted); margin-bottom:18px; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 14px; }
  .form-grid .full{ grid-column:1/-1; }
  label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--teal-deep); display:block; margin-bottom:4px; }
  .form-grid input, .form-grid select{ width:100%; }
  .check-row{ display:flex; align-items:center; gap:8px; margin-top:6px; }
  .check-row label{ margin:0; text-transform:none; font-weight:600; font-size:13px; color:var(--ink); }
  .modal-foot{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  .dup-warning{
    background:var(--red-bg); color:var(--red); font-size:12px; padding:8px 10px; border-radius:8px; margin-top:4px; display:none;
  }
  .field-hint{ font-size:11px; color:var(--muted); margin-top:4px; }

  .legend{
    max-width:1400px; margin:26px auto 0; padding:16px 26px; font-size:12px; color:var(--muted);
    display:flex; gap:18px; flex-wrap:wrap; align-items:center;
  }
  .legend b{ color:var(--ink); }

  @media (max-width: 720px){
    .stat-strip{ display:none; }
    .form-grid{ grid-template-columns:1fr; }
    header{ padding:16px; }
    .toolbar{ padding:0 14px; }
    .team-group{ padding:0 14px; }
  }
  @media print{
    header, .toolbar, .row-actions, .legend, th:last-child, td:last-child{ display:none !important; }
  }
</style>

<body>

<header>
  <div class="header-row">
    <div>
      <div class="brand-eyebrow">Divine Rays Mobile Operations</div>

<div id="groupsContainer"></div>

<!-- Patient Modal -->
<div class="modal-backdrop" id="modalBackdrop">

      </div>

      <div>
        <label>Date encoded</label>

        <div class="check-row"><input type="checkbox" id="f_within24"><label for="f_within24">Submitted within 24 hours</label></div>
        <div class="check-row"><input type="checkbox" id="f_rice"><label for="f_rice">Already availed rice</label></div>
        <div class="check-row"><input type="checkbox" id="f_lab"><label for="f_lab">Already availed laboratory</label></div>

      <button class="btn btn-primary" id="saveBtn">Save patient</button>
    </div>
  </div>
</div>

<script>
/* ---------------- Storage ----------------
   Patient records and the org name live in a Google Sheet, via a
   small Apps Script Web App (see API_URL below) that this page talks
   to over plain HTTPS. Every teammate who opens this page — hosted
   anywhere, no Claude required — reads and writes the same roster.
   There is no push-based live sync: everyone's copy re-checks the
   Sheet on load, every 15s, and right after any save, so updates from
   teammates show up within a few seconds rather than instantly. If
   two people save at nearly the same moment, the later save wins for
   anything they both touched (last-write-wins) — the periodic sync
   just makes sure new records someone else added aren't lost from
   your view. */
const PATIENTS_KEY = "patients";
const ORG_KEY = "orgName";

/* Facility lists */
const HOME_FACILITY = "Abucay";
const facilityOptionsOther = ["Cirian","Maasin","Sogod","Abuyog","Ormoc"];
const facilityOptionsAll = [HOME_FACILITY, ...facilityOptionsOther];

const syncPill = document.getElementById('syncPill');
function setSyncStatus(text, mode){
  syncPill.textContent = text;
  syncPill.className = 'sync-pill' + (mode ? ' ' + mode : '');
}

/* This app talks to a Google Apps Script Web App backed by a Google
   Sheet. Apps Script Web Apps don't send the CORS header a normal
   cross-origin fetch() needs to read its response, so reads use JSONP
   (a <script> tag, not subject to CORS) and writes use a hidden form
   submission (also not subject to CORS — you just can't read its
   response, which is fine here). Set API_URL to the "/exec" URL from
   Deploy → Manage deployments → Web app. */
const API_URL = "https://script.google.com/macros/s/AKfycbyLyuDHs-8Fbt6ock6-MFy8RpwhSj_iYhxr35oHj7MFnHeS-TKHbsIo5fmzQKFnJubPHg/exec";

/* No storage bridge to wait for here — it's a plain HTTPS endpoint. */
async function waitForStorage(){ return true; }

let jsonpCounter = 0;
function jsonpRequest(url, timeoutMs=8000){
  return new Promise((resolve, reject)=>{
    const cbName = 'rosterCb' + (jsonpCounter++) + '_' + Date.now();
    const script = document.createElement('script');
    let done = false;
    const cleanup = () => {
      delete window[cbName];
      if(script.parentNode) script.parentNode.removeChild(script);
    };
    const timer = setTimeout(()=>{
      if(done) return;
      done = true; cleanup();
      reject(new Error('JSONP request timed out'));
    }, timeoutMs);
    window[cbName] = (data)=>{
      if(done) return;
      done = true; clearTimeout(timer); cleanup();
      resolve(data);
    };
    script.onerror = ()=>{
      if(done) return;
      done = true; clearTimeout(timer); cleanup();
      reject(new Error('JSONP script failed to load'));
    };
    const sep = url.includes('?') ? '&' : '?';
    script.src = url + sep + 'callback=' + cbName;
    document.head.appendChild(script);
  });
}

/* fetchShared: read-only, with retry+backoff for transient failures.
   Returns { found:true, value } on success, or { found:false, error }
   if every attempt failed. Callers must NOT treat found:false as "the
   key doesn't exist" — it just means we couldn't read it right now.
   This function never writes to storage. */
async function fetchShared(key, attempts=4){
  let lastErr = null;
  for(let i=0;i<attempts;i++){
    try{
      const data = await jsonpRequest(`${API_URL}?key=${encodeURIComponent(key)}`);
      if(data && data.error) throw new Error(data.error);
      return { found:true, value: (data && data.value != null) ? data.value : null };
    }catch(e){
      lastErr = e;
      if(i < attempts-1) await new Promise(r=>setTimeout(r, 400*(i+1)));
    }
  }
  return { found:false, value:null, error:lastErr };
}

/* Submits a hidden form to the Apps Script endpoint. Cross-domain
   form submissions aren't blocked by CORS (only reading their
   response is), so this reliably reaches the sheet even though we
   can't read a confirmation back — the next sync cycle is what
   verifies the write actually landed. */
function pushSharedViaForm(key, value){
  return new Promise((resolve)=>{
    const frameName = 'rosterSaveFrame_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    const iframe = document.createElement('iframe');
    iframe.name = frameName;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    const form = document.createElement('form');
    form.method = 'POST';
    form.action = API_URL;
    form.target = frameName;
    form.style.display = 'none';

    const keyInput = document.createElement('input');
    keyInput.type = 'hidden'; keyInput.name = 'key'; keyInput.value = key;
    const valInput = document.createElement('input');
    valInput.type = 'hidden'; valInput.name = 'value'; valInput.value = value;
    form.appendChild(keyInput);
    form.appendChild(valInput);
    document.body.appendChild(form);

    let settled = false;
    const finish = () => {
      if(settled) return;
      settled = true;
      setTimeout(()=>{
        if(form.parentNode) form.parentNode.removeChild(form);
        if(iframe.parentNode) iframe.parentNode.removeChild(iframe);
      }, 500);
      resolve();
    };
    iframe.addEventListener('load', finish);
    setTimeout(finish, 6000); // fallback in case load never fires

    form.submit();
  });
}
async function pushShared(key, value){
  await pushSharedViaForm(key, String(value));
  return { ok:true };
}

/* Merge any patient records a teammate has added that we don't have
   locally yet. Does not touch records we already have (avoids
   clobbering an edit in progress), only adds ones that are new to us. */
function mergeRemotePatients(remoteJson){
  if(!remoteJson) return false;
  let remote;
  try{ remote = JSON.parse(remoteJson); }catch(e){ return false; }
  const localIds = new Set(state.patients.map(p=>p.id));
  let added = false;
  remote.forEach(rp=>{
    if(!localIds.has(rp.id)){
      state.patients.push(rp);
      added = true;
    }
  });
  return added;
}

async function pullRemote(){
  setSyncStatus('Syncing…', 'busy');
  const result = await fetchShared(PATIENTS_KEY);
  if(!result.found){
    // Could not read shared data this cycle. Do NOT touch local state
    // or push anything — just report the failure and try again on the
    // next interval / manual sync.
    setSyncStatus('Sync failed — retrying…', 'err');
    return;
  }
  const changed = mergeRemotePatients(result.value);
  const orgResult = await fetchShared(ORG_KEY);
  if(orgResult.found && orgResult.value && document.activeElement !== orgInput){
    orgInput.value = orgResult.value;
  }
  if(changed) renderAll();
  setSyncStatus('Synced ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
}

/* IMPORTANT: this is the fix for the "data disappears" bug.
   loadData() now ONLY reads. It never writes to shared storage, and
   it never invents demo/seed patients. A brand-new roster simply
   starts empty (the UI's existing "No patients yet" state handles
   that) — the very first "Add Patient" you save is what actually
   creates the shared record. That removes any scenario where a slow
   or failed read could get mistaken for "nothing here yet" and
   overwrite real data. */
async function loadData(){
  const result = await fetchShared(PATIENTS_KEY);
  if(result.found){
    if(!result.value) return [];
    try{ return JSON.parse(result.value); }
    catch(e){ throw new Error('Shared roster data is corrupted; refusing to overwrite it.'); }
  }
  console.error('Could not read shared roster after retries', result.error);
  throw new Error('roster-read-failed');
}

async function saveData(){
  renderAll();
  try{
    await pushShared(PATIENTS_KEY, JSON.stringify(state.patients));
    setSyncStatus('Synced ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
  }catch(e){
    console.error("Save failed", e);
    setSyncStatus('Save failed — retrying on next sync', 'err');
  }
}
function seedData(){
  return [
    {id:cryptoId(), team:"Mobile Staff — Site A", name:"DELA CRUZ, JUAN, SANTOS", phid:"1300-0004-937", status:"registered", facility:HOME_FACILITY,
     mca:true, dateEncoded:"2026-08-12", dateSubmitted:"2026-08-12", within24:false, claim:"t1", rice:true, lab:false, notes:""},
    {id:cryptoId(), team:"Mobile Staff — Site A", name:"PELIÑO, VICTORIA, ACEBO", phid:"2300-2412-6981", status:"registered", facility:HOME_FACILITY,
     mca:true, dateEncoded:"2026-08-07", dateSubmitted:"2026-08-07", within24:false, claim:"t1", rice:true, lab:true, notes:""}
  ];
}
function cryptoId(){ return 'p_' + Math.random().toString(36).slice(2,10); }

let state = { patients: [] };

/* ---------------- Rendering ---------------- */
const groupsContainer = document.getElementById('groupsContainer');
const statStrip = document.getElementById('statStrip');
const legend = document.getElementById('legend');
const collapsedTeams = new Set();

function getTeams(){
  return [...new Set(state.patients.map(p=>p.team))];
}

function filteredPatients(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const st = document.getElementById('filterStatus').value;
  const bf = document.getElementById('filterBenefit').value;
  return state.patients.filter(p=>{
    if(q && !(p.name.toLowerCase().includes(q) || p.phid.toLowerCase().includes(q))) return false;
    if(st && p.status !== st) return false;
    if(bf === 'rice-yes' && !p.rice) return false;
    if(bf === 'rice-no' && p.rice) return false;
    if(bf === 'lab-yes' && !p.lab) return false;
    if(bf === 'lab-no' && p.lab) return false;
    return true;
  });
}

function isDuplicate(phid, excludeId){
  return state.patients.some(p => p.phid.trim() === phid.trim() && p.phid.trim() !== "" && p.id !== excludeId);
}

/* ---------------- Claim deadline auto-flagging ----------------
   A patient's T1 claim is due within 24 hours of encoding, cut off
   at 12:00am (midnight) the day after "Date encoded". If a patient
   is still "Pending" once that cutoff passes, it's auto-flagged
   "Missed 24h". */
function claimDeadline(dateEncoded){
  if(!dateEncoded) return null;
  const d = new Date(dateEncoded + "T00:00:00");
  d.setDate(d.getDate() + 1); // the 12am cutoff the day after encoding
  return d;
}
function autoFlagMissedClaims(){
  const now = new Date();
  let changed = false;
  state.patients.forEach(p=>{
    if(p.claim === 'pending'){
      const deadline = claimDeadline(p.dateEncoded);
      if(deadline && now >= deadline){
        p.claim = 'missed24';
        changed = true;
      }
    }
  });
  if(changed) pushShared(PATIENTS_KEY, JSON.stringify(state.patients));
  return changed;
}

const statusLabel = {
  registered:"Registered",
  registered_other:"Registered to other DR facility",
};
const statusClass = {
  registered:"st-registered",
  registered_other:"st-registered-other",
};
const claimLabel = {pending:"Pending", t1:"T1 Submitted", missed24:"Missed 24h"};
const claimClass = {pending:"cl-pending", t1:"cl-t1", missed24:"cl-missed24"};

/* Keep facility consistent whenever a status is set programmatically */
function normalizeFacility(p){
  if(p.status === 'registered'){
    p.facility = HOME_FACILITY;
  } else if(p.status === 'registered_other'){
    if(!facilityOptionsOther.includes(p.facility)) p.facility = facilityOptionsOther[0];
  } else if(!p.facility){
    p.facility = HOME_FACILITY;
  }
}

function renderStats(){
  const all = state.patients;
  const stats = [
    ["Total", all.length],
    ["Registered", all.filter(p=>p.status==='registered').length],
    ["Other facility", all.filter(p=>p.status==='registered_other').length],
    ["Submitted", all.filter(p=>p.status==='submitted').length],
    ["Rice availed", all.filter(p=>p.rice).length],
    ["Lab availed", all.filter(p=>p.lab).length],
    ["Duplicates", all.filter(p=>isDuplicate(p.phid, p.id)).length],
  ];
  statStrip.innerHTML = stats.map(([lbl,num])=>`
    <div class="stat"><div class="num">${num}</div><div class="lbl">${lbl}</div></div>
  `).join('');
}

function renderLegend(){
  legend.innerHTML = `
    <span><b>Status:</b> Registered → Validated → Registered to other DR facility</span>
    <span><b>Facility:</b> "Registered" auto-fills as Abucay. "Registered to other DR facility" lets you pick Cirian, Maasin, Sogod, Abuyog, or Ormoc</span>
    <span><b>Claim:</b> Pending auto-flags to "Missed 24h" once past 12am the day after encoding, unless T1 was already submitted</span>
    <span><b>Duplicate Tracker:</b> auto-flags a repeated PhilHealth ID across the whole roster</span>
    <span><b>Data stored:</b> shared with everyone who opens this roster — teammates' additions appear within ~15s. Export CSV for a backup copy or to share outside this tool</span>
  `;
}

function renderAll(){
  autoFlagMissedClaims();
  state.patients.forEach(normalizeFacility);
  renderStats();
  renderLegend();
  const teams = getTeams();
  const list = filteredPatients();
  populateTeamSelect(teams);

  groupsContainer.innerHTML = '';
  if(teams.length === 0){
    groupsContainer.innerHTML = `<div class="empty-state">No patients yet. Click “Add Patient” to start today's roster.</div>`;
    return;

  teams.forEach(team=>{

        <div class="team-tools">

              <th>Patient name</th>
              <th>PhilHealth ID</th>
              <th>Status</th>
              <th>Facility</th>

              <th>Date encoded</th>
              <th>Date validated<br>&amp; submitted</th>

/* Native <select> elements size themselves to their widest <option>,
   not the currently selected one — which makes short statuses like
   "Registered" look stretched. This measures just the selected
   option's text and sets the select's width to match it. */
function measureTextWidth(text, refEl){
  const span = document.createElement('span');
  const cs = getComputedStyle(refEl);
  span.style.visibility = 'hidden';
  span.style.position = 'absolute';
  span.style.whiteSpace = 'nowrap';
  span.style.fontSize = cs.fontSize;
  span.style.fontFamily = cs.fontFamily;
  span.style.fontWeight = cs.fontWeight;
  span.style.letterSpacing = cs.letterSpacing;
  span.style.textTransform = cs.textTransform;
  span.textContent = text;
  document.body.appendChild(span);
  const width = span.offsetWidth;
  document.body.removeChild(span);
  const paddingLeft = parseFloat(cs.paddingLeft) || 0;
  const paddingRight = parseFloat(cs.paddingRight) || 0;
  const borderLeft = parseFloat(cs.borderLeftWidth) || 0;
  const borderRight = parseFloat(cs.borderRightWidth) || 0;
  return Math.ceil(width + paddingLeft + paddingRight + borderLeft + borderRight + 4);
}
function autosizeBadgeSelects(){
  document.querySelectorAll('select.badge-select').forEach(sel=>{
    const opt = sel.options[sel.selectedIndex];
    const text = opt ? opt.textContent : '';
    sel.style.width = measureTextWidth(text, sel) + 'px';
  });
}

function facilityCellHtml(p){
  if(p.status === 'registered'){
    return `<td style="text-align:center"><span class="fac-fixed">${HOME_FACILITY}</span></td>`;
  }
  const opts = p.status === 'registered_other' ? facilityOptionsOther : facilityOptionsAll;
  return `<td style="text-align:center"><select class="badge-select fac-select" data-field="facility">
    ${opts.map(f=>`<option value="${f}" ${p.facility===f?'selected':''}>${f}</option>`).join('')}
  </select></td>`;
}

function rowHtml(p){
  const dup = isDuplicate(p.phid, p.id);
  return `
    <tr class="${dup?'dup-row':''}" data-id="${p.id}">
      <td class="name">${escapeHtml(p.name)}</td>
      <td class="idcell">${escapeHtml(p.phid)}</td>
      <td style="text-align:center"><select class="badge-select ${statusClass[p.status]}" data-field="status">
        ${Object.entries(statusLabel).map(([k,v])=>`<option value="${k}" ${p.status===k?'selected':''}>${v}</option>`).join('')}
      </select></td>
      ${facilityCellHtml(p)}
      <td style="text-align:center"><input type="checkbox" data-field="mca" ${p.mca?'checked':''}></td>
      <td class="datecell">${p.dateEncoded||'—'}</td>
      <td class="datecell">${p.dateSubmitted||'—'}</td>
      <td style="text-align:center"><input type="checkbox" data-field="within24" ${p.within24?'checked':''}></td>
      <td style="text-align:center"><select class="badge-select ${claimClass[p.claim]}" data-field="claim">
        ${Object.entries(claimLabel).map(([k,v])=>`<option value="${k}" ${p.claim===k?'selected':''}>${v}</option>`).join('')}
      </select></td>
      <td style="text-align:center">${dup ? `<span class="dup-tag dup-flag">DUPLICATE ID</span>` : `<span class="dup-tag dup-new">NEW RECORD</span>`}</td>
      <td style="text-align:center"><input type="checkbox" data-field="rice" ${p.rice?'checked':''}></td>
      <td style="text-align:center"><input type="checkbox" data-field="lab" ${p.lab?'checked':''}></td>
      <td class="row-actions">
        <button class="icon-btn" data-edit="${p.id}" title="Edit">✎</button>
        <button class="icon-btn" data-remove="${p.id}" title="Delete">🗑</button>
      </td>
    </tr>
  `;
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(s){ return escapeHtml(s); }

/* ---------------- Team select in modal ---------------- */
function populateTeamSelect(teams){
  const sel = document.getElementById('f_team');
  const current = sel.value;
  sel.innerHTML = teams.map(t=>`<option value="${escapeAttr(t)}">${escapeHtml(t)}</option>`).join('');
  if(teams.includes(current)) sel.value = current;
}

/* ---------------- Event delegation on table ---------------- */
groupsContainer.addEventListener('click', e=>{
  const teamHead = e.target.closest('.team-head');
  if(teamHead && !e.target.closest('.team-tools')){
    const team = teamHead.dataset.team;
    if(collapsedTeams.has(team)) collapsedTeams.delete(team); else collapsedTeams.add(team);
    renderAll();
    return;
  }
  if(e.target.dataset.rename){
    const oldName = e.target.dataset.rename;
    const newName = prompt("Rename team / site:", oldName);
    if(newName && newName.trim() && newName !== oldName){
      state.patients.forEach(p=>{ if(p.team===oldName) p.team=newName.trim(); });
      saveData();
    }
    return;
  }
  if(e.target.dataset.deleteTeam){
    const team = e.target.dataset.deleteTeam;
    const count = state.patients.filter(p=>p.team===team).length;
    if(confirm(`Delete team "${team}" and its ${count} patient record(s)? This cannot be undone.`)){
      state.patients = state.patients.filter(p=>p.team!==team);
      saveData();
    }
    return;
  }
  if(e.target.dataset.edit){ openModal(e.target.dataset.edit); return; }
  if(e.target.dataset.remove){
    if(confirm("Delete this patient record?")){
      state.patients = state.patients.filter(p=>p.id!==e.target.dataset.remove);
      saveData();
    }
    return;
  }
});

groupsContainer.addEventListener('change', e=>{
  const row = e.target.closest('tr[data-id]');
  if(!row) return;
  const id = row.dataset.id;
  const p = state.patients.find(p=>p.id===id);
  if(!p) return;
  const field = e.target.dataset.field;
  if(!field) return;
  if(e.target.type === 'checkbox') p[field] = e.target.checked;
  else p[field] = e.target.value;

  if(field === 'status') normalizeFacility(p);

  saveData();
});

/* ---------------- Modal ---------------- */
const backdrop = document.getElementById('modalBackdrop');
let editingId = null;

function updateFacilityField(preferredValue){
  const status = document.getElementById('f_status').value;
  const sel = document.getElementById('f_facility');
  const hint = document.getElementById('facilityHint');
  if(status === 'registered'){
    sel.innerHTML = `<option value="${HOME_FACILITY}">${HOME_FACILITY}</option>`;
    sel.value = HOME_FACILITY;
    sel.disabled = true;
    hint.textContent = 'Auto-set to Abucay for "Registered" status.';
  } else if(status === 'registered_other'){
    sel.innerHTML = facilityOptionsOther.map(f=>`<option value="${f}">${f}</option>`).join('');
    sel.disabled = false;
    sel.value = (preferredValue && facilityOptionsOther.includes(preferredValue)) ? preferredValue : facilityOptionsOther[0];
    hint.textContent = 'Choose which DR facility this patient is registered to.';
  } else {
    sel.innerHTML = facilityOptionsAll.map(f=>`<option value="${f}">${f}</option>`).join('');
    sel.disabled = false;
    sel.value = (preferredValue && facilityOptionsAll.includes(preferredValue)) ? preferredValue : HOME_FACILITY;
    hint.textContent = '';
  }
}
document.getElementById('f_status').addEventListener('change', ()=> updateFacilityField());

function openModal(id){
  editingId = id || null;
  const p = id ? state.patients.find(p=>p.id===id) : null;

  document.getElementById('f_name').value = p ? p.name : '';
  document.getElementById('f_phid').value = p ? p.phid : '';
  document.getElementById('f_team').value = p ? p.team : (getTeams()[0]||'');
  document.getElementById('f_status').value = p ? p.status : 'registered';
  updateFacilityField(p ? p.facility : HOME_FACILITY);
  document.getElementById('f_claim').value = p ? p.claim : 'pending';
  document.getElementById('f_dateEncoded').value = p ? p.dateEncoded : new Date().toISOString().slice(0,10);
  document.getElementById('f_dateSubmitted').value = p ? p.dateSubmitted : '';
  document.getElementById('f_mca').checked = p ? p.mca : false;
  document.getElementById('f_within24').checked = p ? p.within24 : false;
  document.getElementById('f_rice').checked = p ? p.rice : false;
  document.getElementById('f_lab').checked = p ? p.lab : false;

document.getElementById('f_phid').addEventListener('input', e=>{

document.getElementById('saveBtn').addEventListener('click', ()=>{
  const name = document.getElementById('f_name').value.trim();

  if(!name){ alert("Patient name is required."); return; }
  const data = {
    team: document.getElementById('f_team').value,

    facility: document.getElementById('f_facility').value,
    claim: document.getElementById('f_claim').value,
    dateEncoded: document.getElementById('f_dateEncoded').value,
    dateSubmitted: document.getElementById('f_dateSubmitted').value,

document.getElementById('addTeamBtn').addEventListener('click', ()=>{

      pendingEmptyTeams.add(name.trim());
      renderAll();

const pendingEmptyTeams = new Set();

/* patch getTeams to include pending empty teams */
const _origGetTeams = getTeams;
getTeams = function(){

  pendingEmptyTeams.forEach(x=>t.add(x));

/* ---------------- CSV export / import ---------------- */
const CSV_HEADERS = ["Team","Patient Name","PhilHealth ID","Status","Facility","Digital MCA","Date Encoded","Date Validated & Submitted","Within 24h","Status of Claim","Rice Availed","Lab Availed","Notes"];

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const rows = [CSV_HEADERS.join(',')];
  state.patients.forEach(p=>{
    rows.push([
      csvSafe(p.team), csvSafe(p.name), csvSafe(p.phid), statusLabel[p.status], csvSafe(p.facility||''),
      p.mca?"YES":"NO", p.dateEncoded||'', p.dateSubmitted||'', p.within24?"YES":"NO",
      claimLabel[p.claim], p.rice?"YES":"NO", p.lab?"YES":"NO", csvSafe(p.notes||'')
    ].join(','));
  });
  const blob = new Blob([rows.join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `field-roster-${stamp}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});
function csvSafe(v){
  v = String(v ?? '');
  if(v.includes(',') || v.includes('"') || v.includes('\n')) return '"' + v.replace(/"/g,'""') + '"';
  return v;
}

document.getElementById('importBtn').addEventListener('click', ()=> document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = evt=>{
    try{
      const lines = evt.target.result.split(/\r?\n/).filter(l=>l.trim());
      lines.shift(); // header
      const statusRev = Object.fromEntries(Object.entries(statusLabel).map(([k,v])=>[v.toLowerCase(),k]));
      const claimRev = Object.fromEntries(Object.entries(claimLabel).map(([k,v])=>[v.toLowerCase(),k]));
      let added = 0;
      lines.forEach(line=>{
        const cols = parseCsvLine(line);
        if(cols.length < 13) return;
        const [team,name,phid,status,facility,mca,dateEnc,dateSub,within24,claim,rice,lab,notes] = cols;
        const resolvedStatus = statusRev[(status||'').toLowerCase()] || 'registered';
        state.patients.push({
          id: cryptoId(), team: team||'Imported', name, phid,
          status: resolvedStatus,
          facility: facility || (resolvedStatus === 'registered' ? HOME_FACILITY : ''),
          mca: (mca||'').toUpperCase()==='YES',
          dateEncoded: dateEnc||'', dateSubmitted: dateSub||'',
          within24: (within24||'').toUpperCase()==='YES',
          claim: claimRev[(claim||'').toLowerCase()] || 'pending',
          rice: (rice||'').toUpperCase()==='YES',
          lab: (lab||'').toUpperCase()==='YES',
          notes: notes||''
        });
        added++;
      });
      saveData();
      alert(`Imported ${added} record(s).`);
    }catch(err){
      alert("Could not read that CSV file. Make sure it was exported from this tool.");
      console.error(err);
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});
function parseCsvLine(line){
  const out = []; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(inQ){
      if(c==='"' && line[i+1]==='"'){ cur+='"'; i++; }
      else if(c==='"'){ inQ=false; }
      else cur+=c;
    } else {
      if(c==='"') inQ=true;
      else if(c===','){ out.push(cur); cur=''; }
      else cur+=c;
    }
  }
  out.push(cur);
  return out;
}

document.getElementById('printBtn').addEventListener('click', ()=> window.print());
document.getElementById('syncNowBtn').addEventListener('click', ()=> pullRemote());

/* ---------------- Init ---------------- */
async function initLoad(){
  setSyncStatus('Connecting…', 'busy');
  groupsContainer.innerHTML = `<div class="empty-state">Loading shared roster…</div>`;
  const ready = await waitForStorage();
  if(!ready) console.error('window.storage was never injected into this page');
  try{
    state.patients = await loadData();
    const orgResult = await fetchShared(ORG_KEY);
    if(orgResult.found && orgResult.value) orgInput.value = orgResult.value;
    setSyncStatus('Synced ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
  }catch(e){
    // Could not read shared data this time. Show an empty table for
    // now rather than guessing — and critically, do NOT write
    // anything to shared storage. The 15s retry loop below will pick
    // up the real data as soon as a read succeeds, with nothing lost
    // in the meantime.
    console.error("Initial load failed, will keep retrying in the background", e);
    state.patients = [];
    setSyncStatus('Offline — retrying…', 'err');
  }
  renderAll();
  // Pick up teammates' additions and re-check missed-claim deadlines
  // regularly, without needing a page reload. This is also what
  // recovers automatically from the "Offline — retrying…" state above.
  setInterval(()=>{ pullRemote(); }, 15000);
  setInterval(()=>{ if(autoFlagMissedClaims()) renderAll(); }, 60000);
}
initLoad();
