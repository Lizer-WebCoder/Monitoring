<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DR CARE</title>
<script>
(async function () {
  var urls = [
    'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/Monitoring@d9c956bcf052540e8c3b260ad7947c9c8a611c87/index.html',
    'https://raw.githack.com/Lizer-WebCoder/Monitoring/d9c956bcf052540e8c3b260ad7947c9c8a611c87/index.html'
  ];
  var lastErr = null;
  for (var i = 0; i < urls.length; i++) {
    try {
      var res = await fetch(urls[i], { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var html = await res.text();
      if (html.indexOf('<html') < 0 && html.indexOf('<!DOCTYPE') < 0) throw new Error('Not HTML');
      html = html.replace(/By : [^·<\n]{2,60} · © 2026 All rights reserved/g, 'By : Lizer \u2665 · © 2026 All rights reserved');
      html = html.split('Generated by DR CARE · Boyz at the Back').join('Generated by DR CARE · Lizer');
      document.open();
      document.write(html);
      document.close();
      return;
    } catch (e) { lastErr = e; }
  }
  document.body.innerHTML = '<p style="font-family:system-ui;padding:2rem">Could not load DR CARE. Hard-refresh or check GitHub Pages.<br><small>' + (lastErr && lastErr.message ? lastErr.message : '') + '</small></p>';
})();
</script>
</head>
<body style="font-family:system-ui;padding:2rem;color:#0f172a">Loading DR CARE…</body>
</html>
